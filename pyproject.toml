[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schattenstadt"
version = "0.1.0"
description = "Agenten-Simulation eines Stadtviertels: Was passiert, wenn der einzige Supermarkt schließt?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["schattenstadt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
